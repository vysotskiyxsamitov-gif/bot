name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: "Мой сайт"
  APP_ID: "com.example.mysite"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Копируем файлы сайта в папку www.
      # Если у сайта есть сборка (React/Vite и т.п.) — добавь тут npm ci && npm run build
      # и замени источник копирования на dist/ или build/.
      - name: Prepare web files
        run: |
          mkdir -p /tmp/www
          rsync -a --exclude=.git --exclude=.github --exclude=node_modules ./ /tmp/www/
          mkdir www && cp -r /tmp/www/. www/

      - name: Setup Capacitor
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "$APP_NAME" "$APP_ID" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
