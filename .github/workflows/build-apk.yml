name: Build AutoX APK

# Собирает отдельное приложение (APK) из скрипта tiktok_chest_android.js
# на базе открытого AutoX.js (шаблон "inrt" — рантайм для упакованных скриптов).

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: "Chest Bot"
  APP_PACKAGE: "com.example.chestbot"
  SCRIPT: "tiktok_chest_android.js"
  AUTOX_REPO: "autox-community/AutoX"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Checkout AutoX.js
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AUTOX_REPO }}
          path: autox

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Put your script into the app template
        run: |
          PROJ=autox/inrt/src/main/assets/project
          rm -rf "$PROJ" && mkdir -p "$PROJ"
          cp "repo/$SCRIPT" "$PROJ/main.js"
          # картинки для поиска на экране (если лежат в репозитории)
          cp repo/*.png "$PROJ/" 2>/dev/null || echo "png в корне репозитория не найдены"
          cat > "$PROJ/project.json" << JSON
          {
            "name": "$APP_NAME",
            "main": "main.js",
            "packageName": "$APP_PACKAGE",
            "versionName": "1.0.0",
            "versionCode": 1,
            "launchConfig": { "hideLogs": true }
          }
          JSON
          ls -la "$PROJ"

      # JitPack публикует RootShell под именем в нижнем регистре (stericson)
      - name: Fix RootShell dependency name
        run: |
          grep -rl "com.github.Stericson" autox --include=*.gradle --include=*.kts --include=*.toml \
            | xargs -r sed -i 's/com\.github\.Stericson/com.github.stericson/g' || true
          grep -rn "RootShell" autox --include=*.gradle --include=*.kts --include=*.toml || true

      # JitPack собирает библиотеки при первом запросе, поэтому первая попытка может
      # упасть с "Could not find" — повторяем до 3 раз.
      - name: Build APK
        working-directory: autox
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew :inrt:assembleDebug --no-daemon --stacktrace && exit 0
            echo "Попытка $i не удалась, жду 60 сек..."
            sleep 60
          done
          exit 1

      - name: Find APK
        run: find autox -name "*.apk" -path "*inrt*" | tee apk-list.txt

      - uses: actions/upload-artifact@v4
        with:
          name: chest-bot-apk
          path: autox/inrt/build/outputs/apk/**/*.apk
